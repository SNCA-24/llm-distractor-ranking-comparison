[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-distractor-ranking"
version = "0.1.0"
description = "Notebook-to-repo refactor for distractor ranking experiments and evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "SNCA-24" }
]
dependencies = [
  "datasets>=2.20.0",
  "matplotlib>=3.8.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "pyarrow>=16.0.0",
  "PyYAML>=6.0.1",
  "scipy>=1.13.0",
  "seaborn>=0.13.0",
  "torch>=2.3.0",
  "transformers>=4.41.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
llm-distractor = "llm_distractor_ranking.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
